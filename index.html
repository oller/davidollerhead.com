<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>David Ollerhead</title>
  <meta name="description" content="Portfolio of David Ollerhead">
  <meta name="author" content="David Ollerhead">
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <style type="text/css">
    .initial {
      position: relative;
      height: 100px;
      width: 100px;
      margin: 0 10px;
    }

    .initial:before {
      /* slightly tighter, more luminous glow */
      box-shadow: 0 0 12px 5px rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      background: #fff;
      position: absolute;
      opacity: 0.25;
      content: "";
      height: 100%;
      width: 100%;
      pointer-events: none;
    }

    /* D shape */
    .initial:first-child {
      width: 90px;
    }

    .initial:first-child .button {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    .initial .button {
      /* Sharper filter for high-DPI clarity */
      filter: blur(0.25px);
      transition: all 280ms cubic-bezier(0.23, 1, 0.32, 1);
      background: #ccd0d4;
      border-radius: 50%;
      position: absolute;
      height: 100%;
      width: 100%;

      /* Refined highlight/shadow layering */
      box-shadow:
        0 14px 22px -4px rgba(0, 0, 0, 0.55),
        inset 0 -3px 4px -1px rgba(0, 0, 0, 0.25),
        0 -10px 15px -1px rgba(255, 255, 255, 0.75),
        inset 0 3px 4px -1px rgba(255, 255, 255, 0.25),
        inset 0 0 4px 1px rgba(255, 255, 255, 0.85),
        inset 0 16px 24px 0 rgba(255, 255, 255, 0.2);
    }

    .initial input {
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      position: absolute;
      cursor: pointer;
      z-index: 1;
      height: 100%;
      width: 100%;
      left: 0;
      top: 0;
    }

    .initial input:active~.button {
      /* Crisper indentation and light shift */
      box-shadow:
        0 12px 20px -4px rgba(0, 0, 0, 0.4),
        inset 0 -8px 25px 1px rgba(255, 255, 255, 0.9),
        0 -10px 15px -1px rgba(255, 255, 255, 0.7),
        inset 0 8px 20px 0 rgba(0, 0, 0, 0.45),
        inset 0 0 8px 1px rgba(255, 255, 255, 0.7);
      transform: scale(0.985);
    }

    .initial input:checked~.button {
      box-shadow:
        0 14px 22px -4px rgba(0, 0, 0, 0.45),
        inset 0 -8px 20px -1px rgba(255, 255, 255, 0.9),
        0 -10px 15px -1px rgba(255, 255, 255, 0.7),
        inset 0 8px 18px 0 rgba(0, 0, 0, 0.25),
        inset 0 0 4px 1px rgba(255, 255, 255, 0.65);
    }
  </style>
</head>

<body>
  <div class="h-screen flex flex-col">
    <div class="h-screen flex items-center justify-center" style="background-color: #ccd0d4;">
      <div class="initial">
        <input type="checkbox" aria-label="D">
        <span class="button"></span>
      </div>
      <div class="initial">
        <input type="checkbox" aria-label="O" checked>
        <span class="button"></span>
      </div>
    </div>

    <div class="px-6 py-8 bg-gray-200">
      <div class="container mx-auto text-gray-400 text-md flex justify-between">
        <span>
          David Ollerhead is a Front End Engineer, based in London
        </span>
        <span class="hidden sm:block">
          &copy;
          <script>document.write(new Date().getFullYear())</script>
        </span>
      </div>
    </div>
  </div>
</body>

</html>
