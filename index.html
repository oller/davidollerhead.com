<!doctype html>
<html lang="en">

<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>David Ollerhead</title>
  <meta name="description" content="David Ollerhead landing page" />
  <meta name="author" content="David Ollerhead" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash
    (function () {
      var saved = null;
      // localStorage can throw (e.g. private mode)
      try {saved = localStorage.getItem("theme");} catch (e) { }
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <script src="https://www.vexo.co/analytics.js" defer></script>
  <script>
    // Theme toggle: flips and saves the theme, with a circular wipe where supported
    document.addEventListener("DOMContentLoaded", function () {
      const toggle = document.getElementById("theme-toggle");

      toggle.addEventListener("click", function () {
        const root = document.documentElement;
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        const apply = () => {
          root.dataset.theme = next;
          try {localStorage.setItem("theme", next);} catch (e) { }
        };

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        // No View Transitions support or reduced motion: switch instantly
        if (!document.startViewTransition || reduceMotion) return apply();

        // Wipe grows from the toggle to the farthest corner of the viewport
        const r = toggle.getBoundingClientRect();
        const x = r.left + r.width / 2;
        const y = r.top + r.height / 2;
        const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));

        // Start at the icon's own size so the wipe visibly grows out of it
        const start = Math.max(r.width, r.height) / 2;

        document.startViewTransition(apply).ready.then(() => {
          root.animate(
            {clipPath: [`circle(${start}px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`]},
            // Gentle ease-out: fast near the icon, slowing smoothly into the far corner
            {duration: 700, easing: "cubic-bezier(0.22, 1, 0.36, 1)", pseudoElement: "::view-transition-new(root)"}
          );
        }).catch(() => { }); // skipped or interrupted: nothing to do
      });

      // Programmatically press and latch the "O" button after load
      const input = document.getElementById("O");
      const container = input.closest(".initial");

      // Toggle class to mirror :active css, keep button pressed, then release
      setTimeout(() => container.classList.add("is-active"), 2000);
      setTimeout(() => {input.checked = true;}, 2500);
      setTimeout(() => container.classList.remove("is-active"), 2550);
    });
  </script>
  <style>
    /* Theme tokens: light is the default, [data-theme="dark"] overrides it */
    :root {
      /* Match native UI (scrollbars etc.) to the theme */
      color-scheme: light;
      --page-from: #d5d9de;
      --page-to: #ccd0d4;
      --footer-bg: #e5e7eb;
      --footer-text: #606876;
      --footer-hover: #4b5563;
      --btn-bg: #ccd0d4;
      /* Halo behind each button */
      --glow-bg: #fff;
      --glow-shadow: rgba(255, 255, 255, 0.9);
      --glow-opacity: 0.25;
      --btn-blur: 0.25px;
      /* Shadow stacks per state: drop shadow, inner shading, light above, inner highlights */
      --shadow-rest:
        0 14px 22px -4px rgba(0, 0, 0, 0.55),
        inset 0 -3px 4px -1px rgba(0, 0, 0, 0.25),
        0 -10px 15px -1px rgba(255, 255, 255, 0.75),
        inset 0 3px 4px -1px rgba(255, 255, 255, 0.25),
        inset 0 0 4px 1px rgba(255, 255, 255, 0.85),
        inset 0 16px 24px 0 rgba(255, 255, 255, 0.2);
      --shadow-active:
        0 12px 20px -4px rgba(0, 0, 0, 0.4),
        inset 0 -8px 25px 1px rgba(255, 255, 255, 0.9),
        0 -10px 15px -1px rgba(255, 255, 255, 0.7),
        inset 0 8px 20px 0 rgba(0, 0, 0, 0.45),
        inset 0 0 8px 1px rgba(255, 255, 255, 0.7);
      --shadow-checked:
        0 14px 22px -4px rgba(0, 0, 0, 0.45),
        inset 0 -8px 20px -1px rgba(255, 255, 255, 0.9),
        0 -10px 15px -1px rgba(255, 255, 255, 0.7),
        inset 0 8px 18px 0 rgba(0, 0, 0, 0.25),
        inset 0 0 4px 1px rgba(255, 255, 255, 0.65);
    }

    /* Dark theme (Tokyo Night inspired). Highlights are muted slate blue rather
       than white, which reads as a grey veil on dark surfaces. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-from: #1e2030;
      --page-to: #24283b;
      --footer-bg: #1a1c2a;
      --footer-text: #7c86b2;
      --footer-hover: #a9b8e8;
      --btn-bg: linear-gradient(180deg, #292d44 0%, #242840 100%);
      --glow-bg: #485a8c;
      --glow-shadow: rgba(72, 90, 140, 0.7);
      /* Fainter halo than light mode (0.25) */
      --glow-opacity: 0.1;
      --shadow-rest:
        0 14px 22px -4px rgba(3, 4, 10, 0.7),
        inset 0 -3px 4px -1px rgba(3, 4, 10, 0.4),
        0 -8px 12px -2px rgba(95, 120, 190, 0.13),
        inset 0 1px 1.5px 0 rgba(105, 130, 200, 0.16),
        inset 0 0 2px 1px rgba(100, 125, 195, 0.08),
        inset 0 16px 24px 0 rgba(105, 130, 200, 0.035);
      --shadow-active:
        0 12px 20px -4px rgba(3, 4, 10, 0.6),
        inset 0 -8px 25px 1px rgba(100, 125, 195, 0.34),
        0 -8px 12px -2px rgba(95, 120, 190, 0.12),
        inset 0 10px 22px 0 rgba(3, 4, 10, 0.85),
        inset 0 3px 6px 0 rgba(3, 4, 10, 0.5),
        inset 0 0 5px 1px rgba(120, 145, 210, 0.32);
      --shadow-checked:
        0 12px 20px -4px rgba(3, 4, 10, 0.6),
        inset 0 -8px 22px 0 rgba(100, 125, 195, 0.3),
        0 -8px 12px -2px rgba(95, 120, 190, 0.11),
        inset 0 10px 22px 0 rgba(3, 4, 10, 0.75),
        inset 0 3px 6px 0 rgba(3, 4, 10, 0.4),
        inset 0 0 5px 1px rgba(120, 145, 210, 0.26);
    }

    *,
    ::before,
    ::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
    }

    html {
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }

    button {
      background: transparent;
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: inherit;
    }

    svg {
      display: block;
      width: 1.25rem;
      height: 1.25rem;
    }

    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: linear-gradient(to top, var(--page-from), var(--page-to));
    }

    main {
      display: flex;
      flex-grow: 1;
      align-items: center;
      justify-content: center;
    }

    .site-footer {
      padding: 2rem 1.5rem;
      background: var(--footer-bg);
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      margin-inline: auto;
      text-align: center;
      color: var(--footer-text);
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .social-links a {
      padding: 0.5rem;
      transition: color 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .site-footer a:hover {
      color: var(--footer-hover);
    }

    @media (min-width: 40rem) {
      .footer-inner {
        max-width: 40rem;
        flex-direction: row;
        justify-content: space-between;
        text-align: left;
      }
    }

    @media (min-width: 48rem) {
      .footer-inner {
        max-width: 48rem;
      }
    }

    @media (min-width: 64rem) {
      .footer-inner {
        max-width: 64rem;
      }
    }

    @media (min-width: 80rem) {
      .footer-inner {
        max-width: 80rem;
      }
    }

    @media (min-width: 96rem) {
      .footer-inner {
        max-width: 96rem;
      }
    }

    /* Theme toggle, top right */
    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px;
      border-radius: 9999px;
      color: var(--footer-text);
      cursor: pointer;
      transition: color 150ms;
    }

    .theme-toggle:hover {
      color: var(--footer-hover);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    /* Sun <-> moon morph: the disc grows while a "cutter" circle slides across it
       to carve the crescent, and the rays shrink into the centre. */
    .theme-icon .body,
    .theme-icon .cutter,
    .theme-icon .rays {
      transform-box: view-box;
      transform-origin: 12px 12px;
    }

    .theme-icon,
    .theme-icon .body,
    .theme-icon .cutter,
    .theme-icon .rays {
      transition: transform 500ms cubic-bezier(0.34, 1.3, 0.5, 1), opacity 300ms ease;
    }

    /* Constant line weight while scaling */
    .theme-icon .disc,
    .theme-icon .cutter {
      vector-effect: non-scaling-stroke;
    }

    .theme-icon {
      transform: rotate(90deg);
    }

    /* Sun state. The 90deg spin is invisible at rest (sun repeats every 45deg) */
    .theme-icon .body {
      transform: scale(0.5);
    }

    .theme-icon .cutter {
      transform: translate(20px, -20px);
    }

    .theme-icon .rays {
      transform: rotate(0deg) scale(1);
      opacity: 1;
    }

    /* Moon state (dark theme) */
    :root[data-theme="dark"] .theme-icon {
      transform: rotate(0deg);
    }

    :root[data-theme="dark"] .theme-icon .body {
      transform: scale(1);
    }

    :root[data-theme="dark"] .theme-icon .cutter {
      transform: translate(4.5px, -4.5px);
    }

    :root[data-theme="dark"] .theme-icon .rays {
      transform: rotate(90deg) scale(0);
      opacity: 0;
    }

    /* Page wipe: disable the default cross-fade (the circle is animated in JS) */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-old(root) {
      z-index: 0;
    }

    ::view-transition-new(root) {
      z-index: 1;
    }

    /* Lift the toggle into its own layer so it stays visible above the wipe */
    .theme-toggle {
      view-transition-name: theme-toggle;
    }

    ::view-transition-group(theme-toggle) {
      z-index: 2;
    }

    /* No icon animation for reduced motion */
    @media (prefers-reduced-motion: reduce) {

      .theme-icon,
      .theme-icon * {
        transition: none !important;
      }
    }

    .initial {
      position: relative;
      height: 100px;
      width: 100px;
      margin: 0 10px;
    }

    .initial::before {
      box-shadow: 0 0 12px 5px var(--glow-shadow);
      border-radius: 50%;
      background: var(--glow-bg);
      position: absolute;
      inset: 0;
      opacity: var(--glow-opacity);
      content: "";
      pointer-events: none;
    }

    /* D shape - overrides */
    .initial:first-child {
      width: 90px;
    }

    .initial:first-child .button {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    .initial .button {
      filter: blur(var(--btn-blur));
      transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 280ms cubic-bezier(0.23, 1, 0.32, 1);
      background: var(--btn-bg);
      border-radius: 50%;
      position: absolute;
      inset: 0;
      box-shadow: var(--shadow-rest);
    }

    .initial input {
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      position: absolute;
      inset: 0;
      cursor: pointer;
      z-index: 1;
    }

    .initial input:checked~.button {
      box-shadow: var(--shadow-checked);
    }

    /* Active press state (native :active and programmatic .is-active) */
    .initial input:active~.button,
    .initial.is-active .button {
      box-shadow: var(--shadow-active);
      transform: scale(0.985);
    }
  </style>
</head>

<body>
  <div class="page">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
      <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <defs>
          <mask id="moon-mask">
            <rect x="-12" y="-12" width="48" height="48" fill="#fff" stroke="none" />
            <circle class="cutter" cx="12" cy="12" r="7.5" fill="#000" stroke="none" />
          </mask>
          <clipPath id="moon-clip">
            <circle cx="12" cy="12" r="10" />
          </clipPath>
        </defs>
        <g class="body">
          <circle class="disc" cx="12" cy="12" r="9" mask="url(#moon-mask)" />
          <g clip-path="url(#moon-clip)">
            <circle class="cutter" cx="12" cy="12" r="7.5" />
          </g>
        </g>
        <g class="rays">
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </g>
      </svg>
    </button>
    <main>
      <div class="initial">
        <input type="checkbox" id="D" aria-label="D" />
        <span class="button"></span>
      </div>
      <div class="initial">
        <input type="checkbox" id="O" aria-label="O" />
        <span class="button"></span>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>
          David Ollerhead is a hands-on Front End focused Engineering Manager.
          Currently @ JPMorganChase.
        </div>
        <div class="social-links">

            aria-label="Open David Ollerhead's GitHub profile (opens in a new tab)">

              <path
